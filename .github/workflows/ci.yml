name: CI

on:
    push:
        branches:
            - master
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Format
              run: yarn format:ci

            - name: Lint
              run: yarn lint:ci

            - name: Typecheck
              run: yarn typecheck

            - name: Build
              run: yarn build

            - name: Test
              run: yarn test
